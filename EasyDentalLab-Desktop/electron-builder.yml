appId: com.roeloffze.easydentallab
productName: EasyDentalLab
copyright: Copyright © 2026 Sarel Roeloffze

publish:
  provider: github
  owner: sarelroeloffze
  repo: EasyDentalLab

directories:
  output: build

files:
  - main.js
  - preload.js
  - renderer-new/dist/**/*
  - resources/**/*

win:
  target: nsis
  icon: resources/icon.ico
  publish:
    provider: github
    owner: sarelroeloffze
    repo: EasyDentalLab

mac:
  target: dmg
  icon: resources/icon.icns
  category: public.app-category.business
  # Ad-hoc signing (no Apple Developer account)
  identity: null
  publish:
    provider: github
    owner: sarelroeloffze
    repo: EasyDentalLab

linux:
  target: AppImage
  icon: resources/icon.png
  category: Office
  publish:
    provider: github
    owner: sarelroeloffze
    repo: EasyDentalLab

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
